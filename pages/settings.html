<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sPay Profile</title>

    <!-- ========================= FAVICON ========================== -->
    <link rel="icon" href="../assets/images/Favicon.png" type="image/png">

    <!-- =================== CSS STYLING ======================== -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/pages/settings.css">
    <link rel="stylesheet" href="../assets/css/pages/form.css">

    <!-- ====================== ICONS & FONTS ==================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- ========================== Container ======================= -->
    <div class="dashboard-container">
        <div class="dashboard-sidebar">
            <div class="sidebar-top">
                <h2 class="sidebar-heading">sPay</h2>
                <div class="sidebar-links">
                    <div><a href="./dashboard.html" class="sidebar-link "><i class="fa-solid fa-home"></i> Dashboard</a>
                    </div>
                    <div><a href="./transactions.html" class="sidebar-link"><i class="fa-solid fa-history"></i>
                            Transactions</a></div>
                    <div><a href="./settings.html" class="sidebar-link sidebar-active"><i class="fa-solid fa-tools"></i>
                            Settings</a></div>
                </div>
            </div>
            <div class="sidebar-bottom">
                <div><a href="./login.html" class="sidebar-link"><i class="fa-solid fa-user"></i> Logout</a></div>
            </div>
        </div>
        <div class="dashboard-content">

            <!-- =========================== NAVBAR ========================= -->
            <div class="dashboard-nav">
                <div class="dashboard-nav-left">Settings</div>
                <div class="dashboard-nav-right">
                    <div class="dashboard-icon"><i class="fa-solid fa-bell"></i></div>
                    <div class="profile">
                        <div class="profile-img"><img src="../assets/images/profile.jpg" alt="Profile"></div>
                        <p>Saqlain</p>
                    </div>
                </div>
            </div>





            <div class="db-settings">
                <div class="image-settings">
                    <div class="change-img">
                       <div class="change-icon"><i class="fa-solid fa-camera"></i></div>
                    </div>
                    <div class="change-img-btns">
                        <a href="#" class="btn btn-sm change-btn">Change</a>
                        <a href="#" class="btn btn-sm"> Remove </a>
                    </div>
                </div>
                <div class="info-settings">
                    <div class="field-group">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="name" placeholder="John Doe" />
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email" placeholder="example123@gmail.com" />
                        </div>
                    </div>
                    <div class="field-group">
                        <div class="form-group">
                            <label>Account Number</label>
                            <input type="tel" id="phoneInput" value="+92 " placeholder="+92 3XX XXXXXXX"
                                maxlength="15" />
                        </div>

                        <div class="form-group">
                            <label>CNIC</label>
                            <input type="text" placeholder="12345 1234567 1" pattern="[0-9]{5}[0-9]{7}[0-9]{1}" />
                        </div>
                    </div>
                    <div class="info-settings-btn">
                        <a href="#" class="btn btn-sm">Save Changes</a>
                    </div>
                </div>
                <div class="password-settings">
                    <div class="psw-setting-head">
                        <h3>Password</h3>
                        <p>Set your new password</p>
                    </div>
                    <div class="field-group">
                        <div class="form-group">
                            <label>Current Password</label>
                            <input type="password" placeholder="123456" maxlength="6" required />
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" placeholder="123456" maxlength="6" required />
                        </div>
                    </div>
                    <div class="psw-settings-btn">
                        <a href="#" class="btn btn-sm">Update Password</a>
                    </div>
                </div>
            </div>






            <!-- ========================= FOOTER ============================ -->
            <footer class="footer">
                <p class="footer-text">Copyright © 2026 sPay, All Right Reserved</p>
            </footer>
        </div>
    </div>









    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/theme.js"></script>
</body>

</html>
